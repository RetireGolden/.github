# Organization-required Grok Build PR review.
# Enforced via org ruleset "Require Grok code review" pointing at this file.
# Secrets:
#   GROK_AUTH_JSON — ~/.grok/auth.json after `grok login` (required by the action).
#   XAI_API_KEY — optional; when set, ~/.grok/config.toml points grok-build at this
#     env var and the CLI prefers it over auth.json.
name: Grok code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Optional manual re-run from the Actions tab on a PR's head repo
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: grok-code-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Grok Build review
    # Docs is AI-produced internal docs; skip entirely. Still skip drafts.
    if: >-
      github.repository != 'RetireGolden/RetireGolden-Docs' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prefer XAI_API_KEY over auth.json
        if: ${{ secrets.XAI_API_KEY != '' }}
        run: |
          mkdir -p ~/.grok
          cat > ~/.grok/config.toml <<'EOF'
          [model.grok-build]
          env_key = "XAI_API_KEY"
          [models]
          default = "grok-build"
          EOF

      - name: Set per-repo review policy
        id: policy
        run: |
          case "$GITHUB_REPOSITORY" in
            RetireGolden/RetireGolden)
              echo "effort=high" >> "$GITHUB_OUTPUT"
              {
                echo "custom_instructions<<EOF"
                echo "Focus on tax/rules correctness, engine vs UI money-math leaks, missing tests for new calculations, CLA/commit identity, and no private planning in the public tree. Obey AGENTS.md."
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            RetireGolden/RetireGolden-MCP)
              echo "effort=high" >> "$GITHUB_OUTPUT"
              {
                echo "custom_instructions<<EOF"
                echo "Focus on tool/schema contracts, no invented tax or statute behavior, auth/secrets handling, CLA/commit identity, and public-copy. Obey AGENTS.md."
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "effort=" >> "$GITHUB_OUTPUT"
              echo "custom_instructions=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run Grok Build review
        id: grok
        uses: 0xr3ngar/grok-build-review-action@eded30018cdee4e83dfca14d18f292b860c30cdd # v1.0.2
        with:
          grok_auth_json: ${{ secrets.GROK_AUTH_JSON }}
          github_token: ${{ github.token }}
          pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          effort: ${{ steps.policy.outputs.effort }}
          custom_instructions: ${{ steps.policy.outputs.custom_instructions }}
          roast_level: professional
          fail_on: never
          status_comments: "true"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Grok code review"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Verdict | \`${{ steps.grok.outputs.verdict }}\` |"
            echo "| Issues | \`${{ steps.grok.outputs.issue_count }}\` |"
            echo "| Bugs | \`${{ steps.grok.outputs.bug_count }}\` |"
            echo "| Review | ${{ steps.grok.outputs.review_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
