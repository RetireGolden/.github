# Reusable Grok Build PR review for RetireGolden.
#
# Target repos invoke this file via a thin caller, for example:
#
#   jobs:
#     grok:
#       uses: RetireGolden/.github/.github/workflows/grok-code-review.yml@main
#       secrets: inherit
#       permissions:
#         contents: read
#         pull-requests: write
#
# Callers should `secrets: inherit` so the existing org XAI_API_KEY is
# available here. Do not invent a new secret. workflow_call declares
# XAI_API_KEY as optional so inherit and an explicit same-name mapping
# both work; required: true would fail the call site instead of this
# job's fail-closed check. Inherited secrets are also readable when
# undeclared; declaring the name documents the contract.
#
# github.event_name inside a called workflow is the caller's event
# (usually pull_request), not workflow_call. Read PR number from the
# caller event first; use inputs.pr_number for dispatch/call. Do not
# use github.event.inputs for workflow_call (that context is empty).
#
# The job-level if still refuses NO SCAN repos even if a ruleset or
# caller would otherwise fire. This repo (RetireGolden/.github) is
# NO SCAN — do not add a caller workflow here.
#
# Secrets:
#   XAI_API_KEY — required at runtime. ~/.grok/config.toml points
#     grok-4.6 at https://api.x.ai/v1 and this env var. SuperGrok
#     session auth is not used.
name: Grok code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Optional manual re-run from the Actions tab on a PR's head repo
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string
  workflow_call:
    inputs:
      pr_number:
        description: PR number to review when the caller is not a pull_request event
        required: false
        type: string
    secrets:
      XAI_API_KEY:
        description: "Existing org xAI API key. Callers should pass secrets: inherit."
        required: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: grok-code-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Grok Build review
    # NO SCAN repos are skipped entirely, even if a caller or ruleset
    # would otherwise fire. Still skip drafts on pull_request;
    # workflow_dispatch and workflow_call remain allowed.
    if: >-
      github.repository != 'RetireGolden/.github' &&
      github.repository != 'RetireGolden/cla-signatures' &&
      github.repository != 'RetireGolden/RetireBench-private' &&
      github.repository != 'RetireGolden/RetireGolden-Docs' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'workflow_call' ||
       (github.event_name == 'pull_request' && !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - name: Require XAI_API_KEY
        if: env.XAI_API_KEY == ''
        run: |
          echo "::error::XAI_API_KEY is empty. This workflow uses only the org API key against api.x.ai; SuperGrok is not a fallback."
          exit 1

      - name: Checkout PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Point grok-4.6 at api.x.ai
        if: env.XAI_API_KEY != ''
        run: |
          mkdir -p ~/.grok
          printf '%s\n' \
            '[model."grok-4.6"]' \
            'model = "grok-4.6"' \
            'base_url = "https://api.x.ai/v1"' \
            'env_key = "XAI_API_KEY"' \
            '[models]' \
            'default = "grok-4.6"' \
            > ~/.grok/config.toml

      - name: Set per-repo review policy
        id: policy
        run: |
          case "$GITHUB_REPOSITORY" in
            RetireGolden/RetireGolden)
              echo "effort=high" >> "$GITHUB_OUTPUT"
              {
                echo "custom_instructions<<EOF"
                echo "On a calculation/logic diff, flag it if there is no unit test, or if the test only mirrors the new code with no citable source (statute subparagraph + what it requires, IRS pub, or DOCS/domain). A green test that only mirrors the new code does not count. Fixtures must discriminate between plausible statutory readings. Keep engine vs UI money-math leaks, CLA/commit identity, and no private planning. Still obey AGENTS.md."
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            RetireGolden/RetireGolden-MCP)
              echo "effort=high" >> "$GITHUB_OUTPUT"
              {
                echo "custom_instructions<<EOF"
                echo "Focus on tool/schema contracts, no invented tax or statute behavior, auth/secrets handling, CLA/commit identity, and public-copy. Obey AGENTS.md."
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            RetireGolden/retiregolden.org|RetireGolden/RetireGolden-Pro|RetireGolden/RetireBench)
              echo "effort=medium" >> "$GITHUB_OUTPUT"
              {
                echo "custom_instructions<<EOF"
                echo "Major issues and security only. This is not a full AGENTS.md audit."
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Empty effort = grok CLI default, which can be high.
              # Unlisted repos must not silently inherit HIGH.
              echo "effort=low" >> "$GITHUB_OUTPUT"
              {
                echo "custom_instructions<<EOF"
                echo "This repository is not on the HIGH or MEDIUM Grok review list. Do not run a high-effort or full AGENTS.md audit. Flag only obvious defects and security issues."
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run Grok Build review
        id: grok
        uses: 0xr3ngar/grok-build-review-action@eded30018cdee4e83dfca14d18f292b860c30cdd # v1.0.2
        with:
          # Official action still requires this input and writes ~/.grok/auth.json.
          # Dummy JSON only; real auth is XAI_API_KEY + config.toml (api.x.ai).
          grok_auth_json: "{}"
          github_token: ${{ github.token }}
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number || github.event.inputs.pr_number }}
          model: grok-4.6
          effort: ${{ steps.policy.outputs.effort }}
          custom_instructions: ${{ steps.policy.outputs.custom_instructions }}
          roast_level: professional
          fail_on: never
          status_comments: "true"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Grok code review"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Verdict | \`${{ steps.grok.outputs.verdict }}\` |"
            echo "| Issues | \`${{ steps.grok.outputs.issue_count }}\` |"
            echo "| Bugs | \`${{ steps.grok.outputs.bug_count }}\` |"
            echo "| Review | ${{ steps.grok.outputs.review_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
