# Reusable Grok PR review for RetireGolden.
#
# Target repos invoke this file via a thin caller, for example:
#
#   jobs:
#     grok:
#       uses: RetireGolden/.github/.github/workflows/grok-code-review.yml@main
#       secrets: inherit
#       permissions:
#         contents: read
#         pull-requests: write
#
# Callers should `secrets: inherit` so the existing org XAI_API_KEY is
# available here. Do not invent a new secret. workflow_call declares
# XAI_API_KEY as optional so inherit and an explicit same-name mapping
# both work; required: true would fail the call site instead of this
# job's fail-closed check. Inherited secrets are also readable when
# undeclared; declaring the name documents the contract.
#
# github.event_name inside a called workflow is the caller's event
# (usually pull_request), not workflow_call. github.event.action is
# opened / synchronize / reopened / ready_for_review. Do not treat
# workflow_call as first-pass by default. Read PR number from the
# caller event first; use inputs.pr_number for dispatch/call. Do not
# use github.event.inputs for workflow_call (that context is empty).
#
# First-pass (opened / reopened / ready_for_review / workflow_dispatch):
#   FlyOverCoderKY/grok-pr-review-action@v1.0.1, grok-4.6,
#   review_scope: full-pr, review_mode: auto, existing per-repo
#   effort, omit max_turns (action default 50).
# Follow-up (synchronize): same action and grok-4.6, review_scope:
#   latest-commit, effort=low, max_turns=30. Do not set verify_model
#   (keep verify on grok-4.6 for xAI prompt-cache reuse). The
#   latest-commit scope embeds only the new work; do not append
#   "latest commit only" to custom_instructions. Pin the immutable
#   v1.0.1 tag until after smoke; do not use @v1 or @main yet.
# pegma-dev is intentionally not switched yet.
#
# The job-level if still refuses NO SCAN repos even if a ruleset or
# caller would otherwise fire. This repo (RetireGolden/.github) is
# NO SCAN — do not add a caller workflow here. Thin callers in
# RetireGolden, MCP, Pro, retiregolden.org, and RetireBench should
# keep firing on synchronize; pass-type is selected here.
#
# Secrets:
#   XAI_API_KEY — required at runtime. Pass it as env on the action
#     steps (not as an action input). The action writes a job-temp
#     GROK_HOME config.toml that points grok-4.6 at
#     https://api.x.ai/v1. SuperGrok / auth.json are not used.
name: Grok code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Optional manual re-run from the Actions tab on a PR's head repo
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string
  workflow_call:
    inputs:
      pr_number:
        description: PR number to review when the caller is not a pull_request event
        required: false
        type: string
    secrets:
      XAI_API_KEY:
        description: "Existing org xAI API key. Callers should pass secrets: inherit."
        required: false

permissions:
  contents: read
  pull-requests: write

# Same PR, two groups: follow-up must not cancel an in-progress first-pass
# (opened / reopened / ready_for_review / workflow_dispatch). Rapid
# follow-ups still cancel each other; rapid first-passes still cancel
# each other. cancel-in-progress stays true within each group.
concurrency:
  group: grok-code-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number || github.event.inputs.pr_number }}-${{ github.event.action == 'synchronize' && 'follow-up' || 'first-pass' }}
  cancel-in-progress: true

jobs:
  review:
    name: Grok PR review
    # NO SCAN repos are skipped entirely, even if a caller or ruleset
    # would otherwise fire. Still skip drafts on pull_request.
    # workflow_dispatch remains allowed (first-pass).
    # Do not treat workflow_call as a run or first-pass discriminator:
    # github.event_name inside a called workflow is the caller's event
    # (usually pull_request). Pass type is github.event.action.
    if: >-
      github.repository != 'RetireGolden/.github' &&
      github.repository != 'RetireGolden/cla-signatures' &&
      github.repository != 'RetireGolden/RetireBench-private' &&
      github.repository != 'RetireGolden/RetireGolden-Docs' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - name: Require XAI_API_KEY
        if: env.XAI_API_KEY == ''
        run: |
          echo "::error::XAI_API_KEY is empty. This workflow uses only the org API key against api.x.ai; SuperGrok is not a fallback."
          exit 1

      - name: Checkout PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set per-repo review policy
        id: policy
        run: |
          case "$GITHUB_REPOSITORY" in
            RetireGolden/RetireGolden)
              echo "effort=high" >> "$GITHUB_OUTPUT"
              {
                echo "custom_instructions<<EOF"
                echo "On a calculation/logic diff, flag it if there is no unit test, or if the test only mirrors the new code with no citable source (statute subparagraph + what it requires, IRS pub, or DOCS/domain). A green test that only mirrors the new code does not count. Fixtures must discriminate between plausible statutory readings. Keep engine vs UI money-math leaks, CLA/commit identity, and no private planning. Still obey AGENTS.md."
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            RetireGolden/RetireGolden-MCP)
              echo "effort=high" >> "$GITHUB_OUTPUT"
              {
                echo "custom_instructions<<EOF"
                echo "Focus on tool/schema contracts, no invented tax or statute behavior, auth/secrets handling, CLA/commit identity, and public-copy. Obey AGENTS.md."
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            RetireGolden/retiregolden.org|RetireGolden/RetireGolden-Pro|RetireGolden/RetireBench)
              echo "effort=medium" >> "$GITHUB_OUTPUT"
              {
                echo "custom_instructions<<EOF"
                echo "Major issues and security only. This is not a full AGENTS.md audit."
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Empty effort = grok CLI default, which can be high.
              # Unlisted repos must not silently inherit HIGH.
              echo "effort=low" >> "$GITHUB_OUTPUT"
              {
                echo "custom_instructions<<EOF"
                echo "This repository is not on the HIGH or MEDIUM Grok review list. Do not run a high-effort or full AGENTS.md audit. Flag only obvious defects and security issues."
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Select first-pass vs follow-up
        id: pass
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          POLICY_EFFORT: ${{ steps.policy.outputs.effort }}
        run: |
          # github.event_name inside workflow_call is the caller's event
          # (usually pull_request), not workflow_call. Derive pass type
          # from github.event.action. workflow_dispatch is first-pass.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || \
             [ "$EVENT_ACTION" = "opened" ] || \
             [ "$EVENT_ACTION" = "reopened" ] || \
             [ "$EVENT_ACTION" = "ready_for_review" ]; then
            KIND=first-pass
            echo "model=grok-4.6" >> "$GITHUB_OUTPUT"
            echo "effort=$POLICY_EFFORT" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_ACTION" = "synchronize" ]; then
            KIND=follow-up
            echo "model=grok-4.6" >> "$GITHUB_OUTPUT"
            echo "effort=low" >> "$GITHUB_OUTPUT"
          else
            KIND=skip
            echo "::notice::Unrecognized caller event ($EVENT_NAME / $EVENT_ACTION); not a first-pass or follow-up review."
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      # First-pass omits max_turns so the action default (50) applies.
      # A blank max_turns input would override that default to empty.
      - name: Run Grok first-pass review
        id: grok_first
        if: steps.pass.outputs.kind == 'first-pass'
        uses: FlyOverCoderKY/grok-pr-review-action@v1.0.1
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number || github.event.inputs.pr_number }}
          model: grok-4.6
          effort: ${{ steps.pass.outputs.effort }}
          review_scope: full-pr
          review_mode: auto
          custom_instructions: ${{ steps.policy.outputs.custom_instructions }}
          roast_level: professional
          fail_on: never
          status_comments: "true"

      # Follow-up: latest-commit scope on the same grok-4.6 model.
      # Do not set verify_model (cache reuse). max_turns 30 is enough
      # for verify; 15 was a cost band-aid for the old full-diff action.
      - name: Run Grok follow-up review
        id: grok_followup
        if: steps.pass.outputs.kind == 'follow-up'
        uses: FlyOverCoderKY/grok-pr-review-action@v1.0.1
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number || github.event.inputs.pr_number }}
          model: grok-4.6
          effort: ${{ steps.pass.outputs.effort }}
          max_turns: 30
          review_scope: latest-commit
          review_mode: auto
          custom_instructions: ${{ steps.policy.outputs.custom_instructions }}
          roast_level: professional
          fail_on: never
          status_comments: "true"

      - name: Summary
        if: always()
        env:
          KIND: ${{ steps.pass.outputs.kind }}
          MODEL: ${{ steps.pass.outputs.model }}
          EFFORT: ${{ steps.pass.outputs.effort }}
          VERDICT_FIRST: ${{ steps.grok_first.outputs.verdict }}
          VERDICT_FOLLOW: ${{ steps.grok_followup.outputs.verdict }}
          ISSUES_FIRST: ${{ steps.grok_first.outputs.issue_count }}
          ISSUES_FOLLOW: ${{ steps.grok_followup.outputs.issue_count }}
          BUGS_FIRST: ${{ steps.grok_first.outputs.bug_count }}
          BUGS_FOLLOW: ${{ steps.grok_followup.outputs.bug_count }}
          ROUND_FIRST: ${{ steps.grok_first.outputs.round }}
          ROUND_FOLLOW: ${{ steps.grok_followup.outputs.round }}
          URL_FIRST: ${{ steps.grok_first.outputs.review_url }}
          URL_FOLLOW: ${{ steps.grok_followup.outputs.review_url }}
        run: |
          if [ "$KIND" = "follow-up" ]; then
            VERDICT="$VERDICT_FOLLOW"
            ISSUES="$ISSUES_FOLLOW"
            BUGS="$BUGS_FOLLOW"
            ROUND="$ROUND_FOLLOW"
            REVIEW="$URL_FOLLOW"
          else
            VERDICT="$VERDICT_FIRST"
            ISSUES="$ISSUES_FIRST"
            BUGS="$BUGS_FIRST"
            ROUND="$ROUND_FIRST"
            REVIEW="$URL_FIRST"
          fi
          {
            echo "### Grok code review"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Pass | \`$KIND\` |"
            echo "| Model | \`$MODEL\` |"
            echo "| Effort | \`$EFFORT\` |"
            echo "| Round | \`$ROUND\` |"
            echo "| Verdict | \`$VERDICT\` |"
            echo "| Open issues | \`$ISSUES\` |"
            echo "| Open bugs | \`$BUGS\` |"
            echo "| Review | $REVIEW"
          } >> "$GITHUB_STEP_SUMMARY"
