# Primary OpenRouter PR review. This workflow is independent of the Grok
# workflow: it receives only the OpenRouter secret and never invokes Grok. The stable
# merge-gate job is `openrouter-first-pass-gate`; with the standard thin-caller
# job id `review`, branch protection should require:
#
#   review / openrouter-first-pass-gate
#
# Target repos invoke this file via a thin caller after this file
# merges, pinned to a reviewed commit. Example:
#
#   jobs:
#     openrouter:
#       uses: RetireGolden/.github/.github/workflows/openrouter-code-review.yml@<reviewed-40-character-commit>
#       secrets:
#         OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
#       permissions:
#         contents: read
#         pull-requests: write
#         statuses: write
#
# Callers must pass OPENROUTER_API_KEY explicitly. Do not use
# secrets: inherit — product repos hold deploy/CLA/GPG secrets that
# must not be forwarded into this review workflow.
#
# Do not add workflow-level concurrency with cancel-in-progress on the
# thin caller. That cancels the whole reusable run, including an
# in-progress first-pass. Job-level groups below use only
# openrouter-* names. Never cancel grok-* concurrency groups.
#
# github.event_name inside a called workflow is the caller's event
# (usually pull_request), not workflow_call. github.event.action is
# opened / synchronize / reopened / ready_for_review. Do not treat
# workflow_call as first-pass by default. Read PR number from the
# caller event first; use inputs.pr_number for dispatch/call. Do not
# use github.event.inputs for workflow_call (that context is empty).
#
# First-pass (opened / reopened / ready_for_review / workflow_dispatch):
#   FlyOverCoderKY/openrouter-pr-review-action (live pin on the
#   uses: lines below; do not restate the version here),
#   models from the shared configuration job (the product repos use the
#   requested grok+glm two-lane roster with the recall-safe judge;
#   RetireGolden-Docs uses a GLM-only lane),
#   review_scope: full-pr, review_mode: auto (continues any existing ledger), existing per-repo
#   effort, max_tool_turns: "50". The action default is now 50
#   (was 8). Omitting this input starved the live bake-off on
#   v1.0.0 (RetireGolden#304: 3.7s / 0 findings vs Grok
#   max_turns=50 finding a real docsConsistency miss). Keep
#   passing 50. Job-level concurrency group is per-PR;
#   cancel-in-progress is false so a later synchronize cannot
#   cancel this review. As of v1.2.0 the first-pass seeds a review
#   loop if absent, or verifies the full PR while retaining it: a hidden ledger plus inline
#   or-finding comments.
#
# Follow-up (synchronize): same action and configured roster, review_scope:
#   latest-commit, review_mode: auto, effort=low, max_tool_turns: "30"
#   (Grok follow-up budget). Job-level concurrency cancels older
#   follow-ups only. Distinct from first-pass and from every grok-*
#   group.
#
#   As of v1.2.0 a synchronize follow-up is a VERIFY round: it diffs
#   from the ledger's last reviewed SHA (cancelled runs cannot skip
#   commits) and adjudicates carried findings via resolutions.
#
#   Follow-up gating: before spending tokens, the follow-up job checks
#   whether a review-loop ledger exists on the PR — the marker the
#   first-pass publishes inside its own review body, trusted only from
#   github-actions[bot], which is the exact condition the harness
#   itself requires. No ledger -> the job SKIPS with a notice (exit 0)
#   instead of a red fail-closed run. That covers pushes that outrun
#   the opening first-pass, PRs opened before the v1.2.0 pin, and
#   GitHub merge-ref hiccups that swallow the opened event entirely
#   (RetireGolden#319). Seed with a workflow_dispatch first-pass.
#   Unlike grok-code-review.yml's comment-marker gate, this checks the
#   ledger itself, so gating can never disagree with what the harness
#   will accept.
#
#   Both review steps carry their own 25-minute timeout (inside the
#   30-minute job budget) so a hung run fails the step rather than
#   being job-cancelled; a failure finalizer then repairs the status
#   comment a dead run would otherwise leave saying "Reviewing…"
#   forever.
#
# Drafts never run on pull_request. The review-job if still refuses
# NO SCAN repos even if a caller or ruleset would otherwise fire.
# This repo (RetireGolden/.github) is NO SCAN — do not add a caller
# workflow here. Thin callers come after this reusable file merges.
#
# Secrets:
#   OPENROUTER_API_KEY — required at runtime for review jobs. Pass it
#     as env on the action steps (not as an action input). No xAI secret is
#     declared or read.
name: OpenRouter code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Optional manual re-run from the Actions tab on a PR's head repo
  workflow_dispatch:
    inputs:
      review_profiles_enabled:
        description: Enable trusted profiles after installing the profile completion gate
        required: false
        type: boolean
        default: false
      review_level:
        description: Follow policy, request a deep review, or cancel a pending deep request
        required: false
        type: choice
        options: ['auto', 'deep', 'cancel']
        default: 'auto'
      pr_number:
        description: PR number to review
        required: true
        type: string
      reset_review:
        description: Explicitly discard review history and start a new initial review
        required: false
        type: boolean
        default: false
      review_policy:
        description: Read REVIEW.md guidance from the immutable target branch
        required: false
        type: choice
        options: ['off', 'base']
        default: 'off'
  workflow_call:
    inputs:
      review_profiles_enabled:
        description: Enable profiles only with the matching trusted completion workflow and CI helpers
        required: false
        type: boolean
        default: false
      review_level:
        description: auto, deep, or cancel; explicit requests require a maintainer dispatch on the default branch
        required: false
        type: string
        default: 'auto'
      review_policy:
        description: Optional target-branch guidance; off or base (all-role execution)
        required: false
        type: string
        default: 'off'
      reset_review:
        description: Reset history on a manual dispatch only; normally continue the ledger
        required: false
        type: boolean
        default: false
      pr_number:
        description: PR number to review when the caller is not a pull_request event
        required: false
        type: string
      max_diff_kb:
        description: >-
          Embedded-diff cap in KB for openrouter-pr-review-action. Org
          default 600 (action default 300). The OpenRouter grok-4.6 route
          caps requests at 500K tokens: a dense 1024KB embed reached ~510K
          tokens and errored the whole lane on RetireGolden#315, whereas a
          truncated diff posts an honest partial verdict. Grok's own
          workflow keeps 1024 (api.x.ai has more headroom).
        required: false
        type: string
        default: "600"
    secrets:
      OPENROUTER_API_KEY:
        description: "Org OpenRouter API key. Callers must pass this secret explicitly. Do not use secrets: inherit (product repos hold deploy/CLA/GPG secrets)."
        required: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review-config:
    name: Resolve trusted review configuration
    if: >-
      github.repository != 'RetireGolden/.github' &&
      github.repository != 'RetireGolden/cla-signatures' &&
      github.repository != 'RetireGolden/RetireBench-private' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      org_sha: ${{ steps.source.outputs.sha }}
      review_profiles: ${{ steps.config.outputs.review_profiles }}
      models: ${{ steps.config.outputs.models }}
      model_routes: ${{ steps.config.outputs.model_routes }}
      effort: ${{ steps.config.outputs.effort }}
      custom_instructions: ${{ steps.config.outputs.custom_instructions }}
    steps:
      - name: Resolve this reusable workflow's immutable source
        id: source
        if: inputs.review_profiles_enabled
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq '[.referenced_workflows[] | select(.path | startswith("RetireGolden/.github/.github/workflows/openrouter-code-review.yml@")) | .sha] | unique | if length == 1 then .[0] else error("ambiguous reusable workflow source") end')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Checkout trusted profile configuration
        if: inputs.review_profiles_enabled
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RetireGolden/.github
          ref: ${{ steps.source.outputs.sha }}
          path: .trusted-review-org
          persist-credentials: false
      - name: Select standing roster and shared guidance
        id: config
        env:
          FOLLOW_UP: ${{ github.event.action == 'synchronize' && 'true' || 'false' }}
          RESET_REVIEW: ${{ inputs.reset_review && 'true' || 'false' }}
          REVIEW_POLICY: ${{ inputs.review_policy || 'off' }}
          PROFILES_ENABLED: ${{ inputs.review_profiles_enabled && 'true' || 'false' }}
          REVIEW_LEVEL: ${{ inputs.review_level || 'auto' }}
          PROFILE_ROOT: ${{ github.workspace }}/.trusted-review-org
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          mode = os.environ.get("REVIEW_POLICY", "off")
          if mode not in {"off", "base"}:
              raise SystemExit("review_policy must be off or base")
          enabled = os.environ.get("PROFILES_ENABLED", "false") == "true"
          level = os.environ.get("REVIEW_LEVEL", "auto")
          if level not in {"auto", "deep", "cancel"}:
              raise SystemExit("review_level must be auto, deep, or cancel")
          if (enabled and mode != "base") or (not enabled and level != "auto"):
              raise SystemExit("profiles require review_policy=base; explicit requests require profiles")
          if enabled and os.environ.get("RESET_REVIEW") == "true":
              raise SystemExit("profile reviews must retain history; reset_review is unsupported")
          # The four adopted repositories now keep domain guidance in REVIEW.md.
          # This configuration is part of the pinned reusable workflow, never PR code.
          policies = {
              "RetireGolden/RetireGolden": {
                  "models": "x-ai/grok-4.6,z-ai/glm-5.3-flash",
                  "effort": "high",
                  "guidance": ""
              },
              "RetireGolden/RetireGolden-MCP": {
                  "models": "x-ai/grok-4.6,z-ai/glm-5.3-flash",
                  "effort": "high",
                  "guidance": ""
              },
              "RetireGolden/retiregolden.org": {
                  "models": "x-ai/grok-4.6,z-ai/glm-5.3-flash",
                  "effort": "high",
                  "guidance": "Run a full review, with particular attention to calculation correctness, public contracts, security, and release integrity. Obey AGENTS.md."
              },
              "RetireGolden/RetireGolden-Pro": {
                  "models": "x-ai/grok-4.6,z-ai/glm-5.3-flash",
                  "effort": "high",
                  "guidance": ""
              },
              "RetireGolden/RetireBench": {
                  "models": "x-ai/grok-4.6,z-ai/glm-5.3-flash",
                  "effort": "medium",
                  "guidance": "Major issues and security only. This is not a full AGENTS.md audit."
              },
              "RetireGolden/RetireGolden-Docs": {
                  "models": "z-ai/glm-5.3-flash",
                  "effort": "medium",
                  "guidance": ""
              },
              "*": {
                  "models": "x-ai/grok-4.6",
                  "effort": "low",
                  "guidance": "This repository is not on the HIGH or MEDIUM Grok review list. Do not run a high-effort or full AGENTS.md audit. Flag only obvious defects and security issues."
              }
          }
          common = 'Pin-bump PRs: when the change advances a SHA-pinned uses: reference (org reusable workflow or action) and the PR body links the upstream commit or release, do not flag the external SHA as unverifiable from this checkout. No checkout can verify a cross-repo pin, and a wrong or workflow-less ref fails at workflow startup rather than silently. Verify what is checkable locally instead: the ref is an exact 40-hex commit (never a branch or mutable tag), the pin comment names the upstream PR and pinned version per org convention, permissions and secrets wiring are unchanged, and any caller contract test that encodes the pin is updated.'
          policy = policies.get(os.environ["GITHUB_REPOSITORY"], policies["*"])
          registry, routes = "", "{}"
          if enabled:
              root = Path(os.environ["PROFILE_ROOT"])
              registry = json.dumps(json.loads((root / "review-profiles.json").read_text()), separators=(",", ":"))
              routes = json.dumps(json.loads((root / "review-model-routes.json").read_text()), separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("models=" + ("" if enabled else policy["models"]) + "\n")
              output.write("effort=" + ("" if enabled else "low" if os.environ.get("FOLLOW_UP") == "true" else policy["effort"]) + "\n")
              output.write("review_profiles=" + registry + "\n")
              output.write("model_routes=" + routes + "\n")
              output.write("custom_instructions<<POLICY_EOF\n")
              output.write(policy["guidance"] + "\n" + common + "\nPOLICY_EOF\n")

  openrouter-first-pass:
    needs: review-config
    name: OpenRouter first-pass review
    outputs:
      action_outcome: ${{ steps.openrouter_first.outcome }}
      verdict: ${{ steps.openrouter_first.outputs.verdict }}
      review_url: ${{ steps.openrouter_first.outputs.review_url }}
    # First-pass is sacred. Job-level concurrency with
    # cancel-in-progress: false means synchronize cannot cancel this
    # job. A second first-pass for the same PR queues.
    # Group is openrouter-first-pass-*, never grok-*.
    concurrency:
      group: openrouter-first-pass-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number || github.event.inputs.pr_number }}
      cancel-in-progress: false
    # NO SCAN repos are skipped entirely, even if a caller or ruleset
    # would otherwise fire. Still skip drafts on pull_request.
    # workflow_dispatch remains allowed (first-pass).
    # Do not treat workflow_call as a run or first-pass discriminator:
    # github.event_name inside a called workflow is the caller's event
    # (usually pull_request). Pass type is github.event.action.
    if: >-
      github.repository != 'RetireGolden/.github' &&
      github.repository != 'RetireGolden/cla-signatures' &&
      github.repository != 'RetireGolden/RetireBench-private' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        (github.event.action == 'opened' ||
         github.event.action == 'reopened' ||
         github.event.action == 'ready_for_review')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || github.event.inputs.pr_number }}
    steps:
      - name: Require OPENROUTER_API_KEY
        if: env.OPENROUTER_API_KEY == ''
        run: |
          echo "::error::OPENROUTER_API_KEY is empty. This workflow authenticates only against openrouter.ai. Callers must pass OPENROUTER_API_KEY explicitly."
          exit 1

      - name: Resolve PR head SHA
        id: head
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::Missing PR number; cannot resolve PR head SHA."
            exit 1
          fi
          HEAD_SHA="${EVENT_HEAD_SHA:-}"
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          fi
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::Could not resolve PR head SHA for PR ${PR_NUMBER}."
            exit 1
          fi
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.head.outputs.sha }}

      # checkout's full-history refspec includes all refs/heads, so live main
      # history is present even when it is not an ancestor of this PR head.

      # First-pass must pass max_tool_turns. The action default is 50
      # as of v1.1.0; still pass 50 so a blank input cannot override.
      - name: Checkout trusted profile coordinator
        if: inputs.review_profiles_enabled
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RetireGolden/.github
          ref: ${{ needs.review-config.outputs.org_sha }}
          path: .trusted-review-org
          persist-credentials: false
      - name: Checkout trusted review contracts
        if: inputs.review_profiles_enabled
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FlyOverCoderKY/openrouter-pr-review-action
          ref: 188cd5557765c858a37c1da78960cd353bcbcd60
          path: .trusted-review-action
          persist-credentials: false
      - name: Resolve pending review request
        id: profile_request
        if: inputs.review_profiles_enabled
        env:
          PYTHONPATH: ${{ github.workspace }}/.trusted-review-org:${{ github.workspace }}/.trusted-review-action/src
          PROFILE_ROOT: ${{ github.workspace }}/.trusted-review-org
          SOURCE_WORKSPACE: ${{ github.workspace }}
          ORG_WORKFLOW_SHA: ${{ needs.review-config.outputs.org_sha }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          REVIEW_LEVEL: ${{ inputs.review_level || 'auto' }}
          REQUEST_STATE_FILE: ${{ runner.temp }}/profile-request-state.json
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -P -m scripts.profile_gate begin
      - name: Prepare shared review snapshot
        id: profile_setup
        if: inputs.review_profiles_enabled
        uses: FlyOverCoderKY/openrouter-pr-review-action@188cd5557765c858a37c1da78960cd353bcbcd60 # action#39 active-response completion
        with:
          role: setup
          github_token: ${{ github.token }}
          pr_number: ${{ env.PR_NUMBER }}
          review_policy: base
          review_profiles: ${{ needs.review-config.outputs.review_profiles }}
          model_routes: ${{ needs.review-config.outputs.model_routes }}
          review_level: ${{ steps.profile_request.outputs.review_level }}
          review_scope: full-pr
          review_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_review && 'initial' || 'auto' }}
          custom_instructions: ${{ needs.review-config.outputs.custom_instructions }}
          roast_level: professional
          fail_on: never
          status_comments: "true"
          max_diff_kb: ${{ inputs.max_diff_kb || '600' }}
          max_tool_turns: "50"
          lane_timeout_seconds: "1080"
          job_budget_seconds: "1320"
          review_context_output_file: ${{ runner.temp }}/review-context.json
      - name: Accept review request
        id: profile_accept
        if: inputs.review_profiles_enabled
        env:
          PYTHONPATH: ${{ github.workspace }}/.trusted-review-org:${{ github.workspace }}/.trusted-review-action/src
          PROFILE_ROOT: ${{ github.workspace }}/.trusted-review-org
          SOURCE_WORKSPACE: ${{ github.workspace }}
          ORG_WORKFLOW_SHA: ${{ needs.review-config.outputs.org_sha }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          REVIEW_LEVEL: ${{ inputs.review_level || 'auto' }}
          REQUEST_STATE_FILE: ${{ runner.temp }}/profile-request-state.json
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_CONTEXT_FILE: ${{ runner.temp }}/review-context.json
          REVIEW_CONTEXT_SHA256: ${{ steps.profile_setup.outputs.review_context_sha256 }}
        run: python3 -P -m scripts.profile_gate accept
      - name: Preserve accepted review request
        if: inputs.review_profiles_enabled && steps.profile_accept.outputs.request_file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.profile_accept.outputs.request_artifact }}
          path: ${{ steps.profile_accept.outputs.request_file }}
          if-no-files-found: error
          retention-days: 90

      - name: Run OpenRouter first-pass review
        id: openrouter_first
        if: steps.profile_request.outputs.skip_review != 'true'
        timeout-minutes: 25
        uses: FlyOverCoderKY/openrouter-pr-review-action@188cd5557765c858a37c1da78960cd353bcbcd60 # action#39 active-response completion
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number || github.event.inputs.pr_number }}
          models: ${{ needs.review-config.outputs.models }}
          model_routes: ${{ needs.review-config.outputs.model_routes }}
          effort: ${{ needs.review-config.outputs.effort }}
          review_context_file: ${{ inputs.review_profiles_enabled && format('{0}/review-context.json', runner.temp) || '' }}
          review_context_sha256: ${{ steps.profile_setup.outputs.review_context_sha256 }}
          review_profiles: ${{ needs.review-config.outputs.review_profiles }}
          review_policy: ${{ inputs.review_policy || 'off' }}
          review_scope: full-pr
          review_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_review && 'initial' || 'auto' }}
          custom_instructions: ${{ needs.review-config.outputs.custom_instructions }}
          roast_level: professional
          fail_on: never
          status_comments: "true"
          max_diff_kb: ${{ inputs.max_diff_kb || '600' }}
          max_tool_turns: "50"

      # The review step has its own timeout so a hung run fails the STEP
      # (job-level timeout cancellation can skip always()/failure() steps).
      # Repair the status comment a dead run leaves saying "Reviewing…".
      - name: Repair the status comment on failure
        if: failure()
        env:
          REVIEW_URL: ${{ steps.openrouter_first.outputs.review_url }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            exit 0
          fi
          MARKER='<!-- openrouter-pr-review-status -->'
          if [ -n "${REVIEW_URL:-}" ]; then
            BODY="$MARKER
          OpenRouter workflow failed or timed out. A review was posted; see its verdict and diagnostics: $REVIEW_URL. Workflow: $RUN_URL"
          else
            BODY="$MARKER
          OpenRouter workflow failed or timed out. Review publication could not be confirmed; inspect the PR reviews and workflow diagnostics: $RUN_URL"
          fi
          existing="$(MARKER="$MARKER" gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .body != null and (.body | contains(env.MARKER))) | .id' \
            | head -n1 || true)"
          if [ -n "$existing" ]; then
            jq -n --arg body "$BODY" '{body: $body}' \
              | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" --input - > /dev/null
          else
            jq -n --arg body "$BODY" '{body: $body}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input - > /dev/null
          fi
          echo "Status comment updated to record the incomplete run."

      - name: Summary
        if: always()
        env:
          MODELS: ${{ needs.review-config.outputs.models }}
          EFFORT: ${{ needs.review-config.outputs.effort }}
          VERDICT: ${{ steps.openrouter_first.outputs.verdict }}
          ISSUES: ${{ steps.openrouter_first.outputs.issue_count }}
          BUGS: ${{ steps.openrouter_first.outputs.bug_count }}
          REVIEW: ${{ steps.openrouter_first.outputs.review_url }}
        run: |
          {
            echo "### OpenRouter code review"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Pass | \`first-pass\` |"
            echo "| Models | \`$MODELS\` |"
            echo "| Effort | \`$EFFORT\` |"
            echo "| Verdict | \`$VERDICT\` |"
            echo "| Open issues | \`$ISSUES\` |"
            echo "| Open bugs | \`$BUGS\` |"
            echo "| Review | $REVIEW"
          } >> "$GITHUB_STEP_SUMMARY"

  # Stable merge-gate check name. The standard thin caller job id is
  # `review`, so the required context is:
  #   review / openrouter-first-pass-gate
  # This gate trusts only OpenRouter reviews authored by github-actions[bot].
  # On synchronize it carries a completed initial review onto the new head;
  # the follow-up review remains visible but is not allowed to erase proof
  # that the required full-PR first pass completed.
  #
  # Decision table:
  # - opened/reopened/ready/manual: only this run's successful action output
  #   plus its exact-current-head published review can pass; an older review
  #   never masks a failed or stale fresh first pass.
  # - synchronize: a prior bot-authored initial review may carry only when its
  #   explicit reviewed commit is the current head or an ancestor of it.
  # - force-push/divergence: historical carry is rejected; a fresh initial
  #   OpenRouter review on the new lineage is required.
  openrouter-first-pass-gate:
    name: openrouter-first-pass-gate
    needs: [openrouter-first-pass]
    if: >-
      always() &&
      !cancelled() &&
      inputs.review_level != 'cancel' &&
      (github.event_name == 'pull_request' ||
       github.event_name == 'workflow_dispatch')
    # Deliberately no concurrency group. GitHub keeps only one pending run per
    # group even when cancel-in-progress is false, so grouping could replace a
    # pending gate for a different head before it emits a terminal check.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || github.event.inputs.pr_number }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      IS_DRAFT: ${{ github.event.pull_request.draft || false }}
      FIRST_PASS_RESULT: ${{ needs.openrouter-first-pass.result }}
      ACTION_OUTCOME: ${{ needs.openrouter-first-pass.outputs.action_outcome }}
      VERDICT: ${{ needs.openrouter-first-pass.outputs.verdict }}
      REVIEW_URL: ${{ needs.openrouter-first-pass.outputs.review_url }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Evaluate OpenRouter first-pass gate
        run: |
          set -euo pipefail

          case "$GITHUB_REPOSITORY" in
            RetireGolden/.github|RetireGolden/cla-signatures|RetireGolden/RetireBench-private)
              echo "NO SCAN repository; openrouter-first-pass-gate succeeds without a review."
              exit 0
              ;;
          esac

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::openrouter-first-pass-gate: missing PR number."
            exit 1
          fi
          if [ "$IS_DRAFT" = "true" ]; then
            echo "::error::Draft PR: OpenRouter first-pass has not run. Mark it ready for review to start the gate."
            exit 1
          fi

          # Resolve the live PR head even for pull_request events. In
          # particular, workflow_dispatch has no event head and must not turn
          # green for a review that became stale while the run was executing.
          HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha || true)"
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="${EVENT_HEAD_SHA:-}"
          fi
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::Could not resolve the current PR head SHA."
            exit 1
          fi

          # A carry candidate must be a real bot-authored initial or full-PR verify
          # review. Verification requires a ledger. Initial partials
          # are ledgerless by design. Both must expose the explicit Commit line,
          # and that SHA must be identical to or an ancestor of the current
          # head. The compare check rejects force-pushed/diverged histories.
          find_review() {
            local expected_url="${1:-}"
            local relationship="${2:-lineage}"
            {
              while IFS= read -r encoded; do
                [ -n "$encoded" ] || continue
                record="$(printf '%s' "$encoded" | base64 --decode)"
                review_url="$(printf '%s' "$record" | jq -r '.html_url // empty')"
                body="$(printf '%s' "$record" | jq -r '.body // empty')"
                reviewed_sha="$(printf '%s\n' "$body" \
                  | sed -n 's/^\*\*Commit:\*\* `\([0-9a-fA-F]\{40\}\)`[[:space:]]*$/\1/p' \
                  | head -n1 \
                  | tr '[:upper:]' '[:lower:]')"
                [ -n "$review_url" ] && [ -n "$reviewed_sha" ] || continue
                if [ -n "$expected_url" ] && [ "$review_url" != "$expected_url" ]; then
                  continue
                fi

                if [ "$relationship" = "exact" ]; then
                  [ "$reviewed_sha" = "$HEAD_SHA" ] || continue
                  compare_status=identical
                else
                  compare_status="$(gh api \
                    "repos/${GITHUB_REPOSITORY}/compare/${reviewed_sha}...${HEAD_SHA}" \
                    --jq .status 2>/dev/null || true)"
                fi
                case "$compare_status" in
                  identical|ahead)
                    printf '%s\t%s\n' "$review_url" "$reviewed_sha"
                    ;;
                esac
              done < <(gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
                --jq '.[] | select(
                  .user.login == "github-actions[bot]" and
                  .body != null and
                  (.body | contains("## OpenRouter pull-request review")) and
                  ((.body | contains("**Mode:** `initial`")) or
                   ((.body | contains("**Mode:** `verify`")) and
                    (.body | contains("**Scope:** `full-pr`")) and
                    (.body | contains("<!-- openrouter-review-ledger:v1:")))) and
                  ((.body | contains("<!-- openrouter-review-ledger:v1:")) or
                   (.body | contains("**Verdict:** `partial`"))) and
                  ((.body | contains("**Verdict:** `clean`")) or
                   (.body | contains("**Verdict:** `issues`")) or
                   (.body | contains("**Verdict:** `partial`")))
                ) | {html_url: .html_url, body: .body} | @base64' || true)
            } | tail -n1
          }

          carry_status() {
            local review_url="$1"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f state=success \
              -f context=openrouter-first-pass \
              -f description="OpenRouter first-pass completed; carried forward" \
              -f target_url="${review_url:-$RUN_URL}" > /dev/null
          }

          succeed() {
            local review_url="$1"
            local message="$2"
            carry_status "$review_url"
            echo "$message"
            exit 0
          }

          if [ "$ACTION_OUTCOME" = "success" ] && \
             { [ "$VERDICT" = "clean" ] || [ "$VERDICT" = "issues" ] || [ "$VERDICT" = "partial" ]; } && \
             [ -n "${REVIEW_URL:-}" ]; then
            # Validate the published artifact itself. Outputs alone can be
            # stale on workflow_dispatch if the PR head moved mid-run.
            active="$(find_review "$REVIEW_URL" exact)"
            if [ -n "$active" ]; then
              active_url="${active%%$'\t'*}"
              succeed "$active_url" "The active OpenRouter first-pass published a usable ${VERDICT} review for current head ${HEAD_SHA}."
            fi
          fi

          # Historical evidence is never consulted for an active first-pass
          # event. A failed reopen/ready/manual run must remain failed.
          if [ "$EVENT_ACTION" != "synchronize" ]; then
            echo "::error::OpenRouter first-pass did not publish a usable review (job=${FIRST_PASS_RESULT:-missing}, action=${ACTION_OUTCOME:-missing}, verdict=${VERDICT:-missing}, review_url=${REVIEW_URL:-missing})."
            exit 1
          fi

          existing="$(find_review "" lineage)"
          if [ -n "$existing" ]; then
            existing_url="${existing%%$'\t'*}"
            existing_sha="${existing#*$'\t'}"
            succeed "$existing_url" "OpenRouter first-pass at ${existing_sha} is in the current lineage; carried onto ${HEAD_SHA}."
          fi

          # synchronize can race the opening review. Keep the required check
          # pending while that first pass may still be publishing.
          echo "Waiting for a lineage-valid OpenRouter first-pass review (up to 30 minutes)."
          for _ in $(seq 1 90); do
            sleep 20
            existing="$(find_review "" lineage)"
            if [ -n "$existing" ]; then
              existing_url="${existing%%$'\t'*}"
              existing_sha="${existing#*$'\t'}"
              succeed "$existing_url" "OpenRouter first-pass at ${existing_sha} appeared in the current lineage; carried onto ${HEAD_SHA}."
            fi
          done
          echo "::error::Timed out waiting for a lineage-valid OpenRouter first-pass review. A force-pushed/diverged head requires a fresh full initial review."
          exit 1

  openrouter-follow-up:
    needs: review-config
    name: OpenRouter follow-up review
    # Rapid synchronize events cancel older follow-ups only.
    # This group is distinct from first-pass and from every grok-*
    # group, so pushes cannot cancel the opening Grok or OpenRouter
    # first-pass reviews.
    concurrency:
      group: openrouter-follow-up-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number || github.event.inputs.pr_number }}
      cancel-in-progress: true
    if: >-
      github.repository != 'RetireGolden/.github' &&
      github.repository != 'RetireGolden/cla-signatures' &&
      github.repository != 'RetireGolden/RetireBench-private' &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || github.event.inputs.pr_number }}
    steps:
      # v1.2.0 follow-ups are verify rounds that need the loop ledger the
      # first-pass publishes inside its own review body. Checking for the
      # ledger itself (not a separate marker) means this gate can never
      # disagree with what the harness will accept. Trust only
      # github-actions[bot]-authored reviews, same as the harness default.
      - name: Require a seeded review loop
        id: seeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::notice::Skipping OpenRouter follow-up: missing PR number. No OpenRouter spend."
            exit 0
          fi
          # Count matches per page and sum: the pipeline drains every page,
          # so an early match can never SIGPIPE gh under pipefail (a grep -q
          # here would close the pipe mid-pagination and read as unseeded).
          if ! matches="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
              --jq '[.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains("<!-- openrouter-review-ledger:v1:")))] | length' \
              | awk '{sum += $1} END {print sum + 0}')"; then
            echo "::warning::Could not list PR reviews for the ledger check; skipping the follow-up without spend. Re-run or dispatch a first-pass."
            exit 0
          fi
          if [ "${matches:-0}" -gt 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Review-loop ledger found; running the verify round."
            exit 0
          fi
          echo "::notice::Skipping OpenRouter follow-up: no review-loop ledger exists on PR ${PR_NUMBER} (first-pass still running, failed, or never triggered — e.g. a swallowed opened event). Seed with a workflow_dispatch first-pass. No OpenRouter spend."

      - name: Require OPENROUTER_API_KEY
        if: steps.seeded.outputs.ready == 'true' && env.OPENROUTER_API_KEY == ''
        run: |
          echo "::error::OPENROUTER_API_KEY is empty. This workflow authenticates only against openrouter.ai. Callers must pass OPENROUTER_API_KEY explicitly."
          exit 1

      - name: Resolve PR head SHA
        if: steps.seeded.outputs.ready == 'true'
        id: head
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::Missing PR number; cannot resolve PR head SHA."
            exit 1
          fi
          HEAD_SHA="${EVENT_HEAD_SHA:-}"
          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          fi
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::Could not resolve PR head SHA for PR ${PR_NUMBER}."
            exit 1
          fi
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        if: steps.seeded.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.head.outputs.sha }}

      # Full history fetches all branch refs, including the trusted main tip.

      # Follow-up: latest-commit, effort=low, max_tool_turns 30 to
      # match the Grok follow-up budget.
      - name: Checkout trusted profile coordinator
        if: inputs.review_profiles_enabled && steps.seeded.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RetireGolden/.github
          ref: ${{ needs.review-config.outputs.org_sha }}
          path: .trusted-review-org
          persist-credentials: false
      - name: Checkout trusted review contracts
        if: inputs.review_profiles_enabled && steps.seeded.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FlyOverCoderKY/openrouter-pr-review-action
          ref: 188cd5557765c858a37c1da78960cd353bcbcd60
          path: .trusted-review-action
          persist-credentials: false
      - name: Resolve pending review request
        id: profile_request
        if: inputs.review_profiles_enabled && steps.seeded.outputs.ready == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/.trusted-review-org:${{ github.workspace }}/.trusted-review-action/src
          PROFILE_ROOT: ${{ github.workspace }}/.trusted-review-org
          SOURCE_WORKSPACE: ${{ github.workspace }}
          ORG_WORKFLOW_SHA: ${{ needs.review-config.outputs.org_sha }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          REVIEW_LEVEL: ${{ inputs.review_level || 'auto' }}
          REQUEST_STATE_FILE: ${{ runner.temp }}/profile-request-state.json
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -P -m scripts.profile_gate begin
      - name: Prepare shared review snapshot
        id: profile_setup
        if: inputs.review_profiles_enabled && steps.seeded.outputs.ready == 'true'
        uses: FlyOverCoderKY/openrouter-pr-review-action@188cd5557765c858a37c1da78960cd353bcbcd60 # action#39 active-response completion
        with:
          role: setup
          github_token: ${{ github.token }}
          pr_number: ${{ env.PR_NUMBER }}
          review_policy: base
          review_profiles: ${{ needs.review-config.outputs.review_profiles }}
          model_routes: ${{ needs.review-config.outputs.model_routes }}
          review_level: ${{ steps.profile_request.outputs.review_level }}
          review_scope: latest-commit
          review_mode: auto
          custom_instructions: ${{ needs.review-config.outputs.custom_instructions }}
          roast_level: professional
          fail_on: never
          status_comments: "true"
          max_diff_kb: ${{ inputs.max_diff_kb || '600' }}
          max_tool_turns: "50"
          lane_timeout_seconds: "1080"
          job_budget_seconds: "1320"
          review_context_output_file: ${{ runner.temp }}/review-context.json
      - name: Accept review request
        id: profile_accept
        if: inputs.review_profiles_enabled && steps.seeded.outputs.ready == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/.trusted-review-org:${{ github.workspace }}/.trusted-review-action/src
          PROFILE_ROOT: ${{ github.workspace }}/.trusted-review-org
          SOURCE_WORKSPACE: ${{ github.workspace }}
          ORG_WORKFLOW_SHA: ${{ needs.review-config.outputs.org_sha }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          REVIEW_LEVEL: ${{ inputs.review_level || 'auto' }}
          REQUEST_STATE_FILE: ${{ runner.temp }}/profile-request-state.json
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_CONTEXT_FILE: ${{ runner.temp }}/review-context.json
          REVIEW_CONTEXT_SHA256: ${{ steps.profile_setup.outputs.review_context_sha256 }}
        run: python3 -P -m scripts.profile_gate accept
      - name: Preserve accepted review request
        if: inputs.review_profiles_enabled && steps.seeded.outputs.ready == 'true' && steps.profile_accept.outputs.request_file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.profile_accept.outputs.request_artifact }}
          path: ${{ steps.profile_accept.outputs.request_file }}
          if-no-files-found: error
          retention-days: 90

      - name: Run OpenRouter follow-up review
        id: openrouter_followup
        if: steps.seeded.outputs.ready == 'true' && steps.profile_request.outputs.skip_review != 'true'
        timeout-minutes: 25
        uses: FlyOverCoderKY/openrouter-pr-review-action@188cd5557765c858a37c1da78960cd353bcbcd60 # action#39 active-response completion
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number || github.event.inputs.pr_number }}
          models: ${{ needs.review-config.outputs.models }}
          model_routes: ${{ needs.review-config.outputs.model_routes }}
          effort: ${{ needs.review-config.outputs.effort }}
          review_context_file: ${{ inputs.review_profiles_enabled && format('{0}/review-context.json', runner.temp) || '' }}
          review_context_sha256: ${{ steps.profile_setup.outputs.review_context_sha256 }}
          review_profiles: ${{ needs.review-config.outputs.review_profiles }}
          review_policy: ${{ inputs.review_policy || 'off' }}
          review_scope: latest-commit
          review_mode: auto
          custom_instructions: ${{ needs.review-config.outputs.custom_instructions }}
          roast_level: professional
          fail_on: never
          status_comments: "true"
          max_diff_kb: ${{ inputs.max_diff_kb || '600' }}
          max_tool_turns: ${{ inputs.review_profiles_enabled && '50' || '30' }}

      # Same step-timeout + finalizer rationale as the first-pass job.
      - name: Repair the status comment on failure
        if: failure()
        env:
          REVIEW_URL: ${{ steps.openrouter_followup.outputs.review_url }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            exit 0
          fi
          MARKER='<!-- openrouter-pr-review-status -->'
          if [ -n "${REVIEW_URL:-}" ]; then
            BODY="$MARKER
          OpenRouter workflow failed or timed out. A review was posted; see its verdict and diagnostics: $REVIEW_URL. Workflow: $RUN_URL"
          else
            BODY="$MARKER
          OpenRouter workflow failed or timed out. Review publication could not be confirmed; inspect the PR reviews and workflow diagnostics: $RUN_URL"
          fi
          existing="$(MARKER="$MARKER" gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .body != null and (.body | contains(env.MARKER))) | .id' \
            | head -n1 || true)"
          if [ -n "$existing" ]; then
            jq -n --arg body "$BODY" '{body: $body}' \
              | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" --input - > /dev/null
          else
            jq -n --arg body "$BODY" '{body: $body}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input - > /dev/null
          fi
          echo "Status comment updated to record the incomplete run."

      - name: Summary
        if: always()
        env:
          MODELS: ${{ needs.review-config.outputs.models }}
          SEEDED: ${{ steps.seeded.outputs.ready }}
          VERDICT: ${{ steps.openrouter_followup.outputs.verdict }}
          ISSUES: ${{ steps.openrouter_followup.outputs.issue_count }}
          BUGS: ${{ steps.openrouter_followup.outputs.bug_count }}
          REVIEW: ${{ steps.openrouter_followup.outputs.review_url }}
        run: |
          {
            echo "### OpenRouter code review"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Pass | \`follow-up\` |"
            echo "| Seeded | \`${SEEDED:-false}\` |"
            echo "| Models | \`$MODELS\` |"
            echo "| Effort | \`low\` |"
            echo "| Verdict | \`$VERDICT\` |"
            echo "| Open issues | \`$ISSUES\` |"
            echo "| Open bugs | \`$BUGS\` |"
            echo "| Review | $REVIEW"
          } >> "$GITHUB_STEP_SUMMARY"
